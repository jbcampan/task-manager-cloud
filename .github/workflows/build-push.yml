name: Build & Push

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: apps/backend/Dockerfile
            repository: ${{ vars.ECR_BACKEND_REPOSITORY }}
          - name: frontend
            dockerfile: apps/frontend/Dockerfile
            repository: ${{ vars.ECR_FRONTEND_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Built and loaded locally first (push: false) so Trivy can scan it
      # before anything reaches ECR - a failed scan means nothing gets pushed.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runner
          tags: ${{ matrix.repository }}:${{ github.sha }}
          load: true
          push: false

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.repository }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image to ECR
        run: docker push ${{ matrix.repository }}:${{ github.sha }}

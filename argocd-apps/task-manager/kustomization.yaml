apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment-backend.yaml
  - deployment-frontend.yaml
  - service-backend.yaml
  - service-frontend.yaml

# Rewritten by CI on every deploy (kustomize edit set image ...) - the
# "name" below must match the image name (without tag) used in the
# Deployment files exactly, or the transformer silently does nothing.
images:
  - name: 595949105416.dkr.ecr.eu-west-3.amazonaws.com/task-manager-backend
    newTag: placeholder
  - name: 595949105416.dkr.ecr.eu-west-3.amazonaws.com/task-manager-frontend
    newTag: placeholder

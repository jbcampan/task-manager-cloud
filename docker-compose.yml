services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskmanager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskmanager-net

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: builder
    container_name: taskmanager-api
    command: npm run start:dev
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskmanager
      JWT_SECRET: local-dev-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '3001:3001'
    volumes:
      - ./apps/backend/src:/app/apps/backend/src:ro
      - ./apps/backend/prisma:/app/apps/backend/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskmanager-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: builder
    container_name: taskmanager-frontend
    command: npm run dev --workspace=apps/frontend
    environment:
      NODE_ENV: development
      PORT: 3000
      # Server-only — resolved via Docker's internal DNS to the "api" service,
      # never exposed to the browser (no NEXT_PUBLIC_ prefix).
      API_URL:
        http://api:3001/api/v1
        # Windows/macOS Docker Desktop bind mounts don't reliably propagate file
      # change events into the container — force polling instead.
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src:ro
      - ./apps/frontend/public:/app/apps/frontend/public:ro
    depends_on:
      - api
    networks:
      - taskmanager-net
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: taskmanager-adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    networks:
      - taskmanager-net

volumes:
  postgres_data:

networks:
  taskmanager-net:
    driver: bridge

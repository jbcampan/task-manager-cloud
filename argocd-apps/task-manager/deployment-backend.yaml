apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: task-manager
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        # Separate from "app: backend" on purpose - see 18-networkpolicy-
        # alb-to-backend.yaml.tftpl / egress policy: this label targets
        # "anything that talks to RDS/S3", including the one-off
        # migration Job, without putting that Job in the Service's
        # load-balancing rotation.
        db-access: 'true'
    spec:
      serviceAccountName: backend
      # Matches app.enableShutdownHooks() in main.ts - gives NestJS time
      # to close DB connections cleanly on SIGTERM before the pod is killed.
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          # Placeholder - overwritten by the images: transformer in
          # kustomization.yaml. Never edit this tag by hand; it is
          # rewritten by CI (`kustomize edit set image`) on every deploy.
          image: 595949105416.dkr.ecr.eu-west-3.amazonaws.com/task-manager-backend:placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          # DB_HOST/DB_PORT/DB_NAME now come from backend-config (see
          # k8s-templates/04-configmap-backend.yaml.tftpl, M4.2) instead
          # of a dedicated env: block here - this manifest carries no
          # value that Terraform alone knows.
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: task-manager-jwt-secret
            - secretRef:
                name: task-manager-rds-credentials
          # Same routes as the ECS ALB health check target group - global
          # prefix "api" + URI versioning "v1" from main.ts both apply to
          # HealthController, so the real path is /api/v1/health/*.
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

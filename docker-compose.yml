services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskmanager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskmanager-net

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: builder
    container_name: taskmanager-api
    command: npm run start:dev
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskmanager
      JWT_SECRET: local-dev-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '3001:3001'
    volumes:
      - ./apps/backend/src:/app/apps/backend/src:ro
      - ./apps/backend/prisma:/app/apps/backend/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskmanager-net
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: taskmanager-adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    networks:
      - taskmanager-net

volumes:
  postgres_data:

networks:
  taskmanager-net:
    driver: bridge

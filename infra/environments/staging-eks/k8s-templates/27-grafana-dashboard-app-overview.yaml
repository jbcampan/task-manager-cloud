apiVersion: v1
kind: ConfigMap
metadata:
  name: task-manager-overview-dashboard
  namespace: task-manager
  labels:
    # Matches grafana.sidecar.dashboards.label set in
    # _modules/kube-prometheus-stack/main.tf - the sidecar watches for
    # this exact label across every namespace (searchNamespace: "ALL").
    grafana_dashboard: '1'
data:
  task-manager-overview.json: |
    {
      "id": null,
      "uid": "task-manager-app",
      "title": "Task Manager - Application",
      "tags": ["task-manager"],
      "timezone": "",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-6h", "to": "now" },
      "templating": { "list": [] },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP Request Rate (backend)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{job=\"backend\"}[5m])) by (status_code)",
              "legendFormat": "{{status_code}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP Error Rate % (backend, 5xx)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(rate(http_requests_total{job=\"backend\", status_code=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"backend\"}[5m]))",
              "legendFormat": "5xx ratio"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "P95 Latency (backend)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"backend\"}[5m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pod Restarts (task-manager, 1h)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"task-manager\"}[1h])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Process Resident Memory (backend / frontend)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "process_resident_memory_bytes{job=~\"backend|frontend\"}",
              "legendFormat": "{{job}}"
            }
          ]
        }
      ]
    }

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: task-manager
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # kubernetes.io/metadata.name is an immutable label auto-applied to
    # every namespace since Kubernetes 1.21 - safe to rely on without
    # having verified it manually. k8s-app: kube-dns is CoreDNS's standard
    # label on EKS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

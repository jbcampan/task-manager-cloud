name: CD (ECS)

on:
  workflow_run:
    workflows: ['Build & Push']
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/deploy-reusable.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: staging
      image_tag: ${{ github.event.workflow_run.head_sha }}

  deploy-prod:
    needs: deploy-staging
    # Prod infra (infra/environments/prod) doesn't exist yet - this job
    # is a no-op until the PROD_INFRA_READY repo variable is set to
    # "true", which happens once that Terraform environment is applied.
    if: ${{ vars.PROD_INFRA_READY == 'true' }}
    uses: ./.github/workflows/deploy-ecs-reusable.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: production
      image_tag: ${{ github.event.workflow_run.head_sha }}
